name: Publish self-example

# Publication is intentionally separate from compilation. This workflow is
# keyless: the operator selects a target, and publication promotes the newest
# successful retained compilation for that target.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to publish from its latest successful compilation"
        required: true
        type: choice
        default: journal_academic
        options:
          - journal_academic
          - magazine_general
          - explain_like_im_5

permissions:
  contents: read
  actions: read

concurrency:
  group: compiled-prose-self-example-publish
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble retained candidates
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    env:
      TARGET_ID: ${{ inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate selected target
        run: |
          target_path="$(python tools/self_example_targets.py "$TARGET_ID")"
          test -f "$target_path"

      - name: Resolve latest successful retained artifacts
        id: retained
        uses: actions/github-script@v8
        env:
          TARGET_ID: ${{ inputs.target }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            function newerCandidate(left, right) {
              if (!left) return right;
              if (!right) return left;
              const leftCreated = Date.parse(left.run.created_at);
              const rightCreated = Date.parse(right.run.created_at);
              if (rightCreated > leftCreated) return right;
              if (rightCreated < leftCreated) return left;
              return right.run.id > left.run.id ? right : left;
            }

            async function newestSuccessfulMatching(matchesArtifact, workflowPath) {
              let newest = null;
              for (const artifact of artifacts) {
                if (
                  artifact.expired ||
                  !matchesArtifact(artifact) ||
                  !artifact.workflow_run?.id
                ) {
                  continue;
                }

                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: artifact.workflow_run.id,
                });
                if (
                  run.conclusion !== "success" ||
                  run.event !== "workflow_dispatch" ||
                  run.path !== workflowPath
                ) {
                  continue;
                }

                newest = newerCandidate(newest, { artifact, run });
              }
              return newest;
            }

            function newestSuccessful(prefix, workflowPath) {
              return newestSuccessfulMatching(
                artifact => artifact.name.startsWith(prefix),
                workflowPath
              );
            }

            // Before compile and publish became separate workflows, the accepted
            // academic publication retained its compilation as
            // self-example-candidate-<40-hex-source-sha>. It is a real successful
            // academic compilation and remains eligible until a newer academic
            // compile-only candidate supersedes it.
            const legacyAcademic = await newestSuccessfulMatching(
              artifact => /^self-example-candidate-[0-9a-f]{40}$/.test(artifact.name),
              ".github/workflows/publish-self-example.yml"
            );

            const target = process.env.TARGET_ID;
            const modernCandidate = await newestSuccessful(
              `self-example-candidate-${target}-`,
              ".github/workflows/compile-self-example.yml"
            );
            const candidate = target === "journal_academic"
              ? newerCandidate(modernCandidate, legacyAcademic)
              : modernCandidate;
            if (!candidate) {
              core.setFailed(
                `No successful retained compilation exists for target ${target}. ` +
                "Run Compile self-example target successfully first."
              );
              return;
            }

            core.info(
              `Publishing ${target} from successful retained compilation run ${candidate.run.id} ` +
              `(${candidate.artifact.name}).`
            );
            core.setOutput("candidate-run-id", String(candidate.run.id));
            core.setOutput("candidate-artifact", candidate.artifact.name);

            const base = await newestSuccessful(
              "self-example-showcase-",
              ".github/workflows/publish-self-example.yml"
            );
            if (base) {
              core.info(
                `Preserving unselected targets from successful publish run ${base.run.id}.`
              );
              core.setOutput("base-run-id", String(base.run.id));
              core.setOutput("base-artifact", base.artifact.name);
              core.setOutput("base-kind", "showcase");
              return;
            }

            // A non-academic target needs the legacy academic publication only
            // until the first modern multi-target showcase has been retained.
            // When journal_academic itself is selected, the legacy candidate is
            // already the selected candidate and must not be imported twice.
            if (target !== "journal_academic" && legacyAcademic) {
              core.info(
                `Preserving legacy published academic candidate from run ` +
                `${legacyAcademic.run.id} (${legacyAcademic.artifact.name}).`
              );
              core.setOutput("base-run-id", String(legacyAcademic.run.id));
              core.setOutput("base-artifact", legacyAcademic.artifact.name);
              core.setOutput("base-kind", "legacy-academic");
            } else {
              core.info("No separate prior retained publication base is needed.");
            }

      - name: Require academic target for first publication
        if: ${{ steps.retained.outputs.base-run-id == '' && inputs.target != 'journal_academic' }}
        run: |
          echo "No prior published academic candidate is available to preserve the legacy academic URLs." >&2
          echo "Publish journal_academic first, then publish additional targets normally." >&2
          exit 2

      - name: Install keyless publication dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          pandoc --version

      - name: Download prior published showcase
        if: ${{ steps.retained.outputs.base-kind == 'showcase' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.base-artifact }}
          path: base-showcase
          run-id: ${{ steps.retained.outputs.base-run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download legacy published academic candidate
        if: ${{ steps.retained.outputs.base-kind == 'legacy-academic' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.base-artifact }}
          path: legacy-academic
          run-id: ${{ steps.retained.outputs.base-run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download selected target candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.candidate-artifact }}
          path: candidate
          run-id: ${{ steps.retained.outputs.candidate-run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Assemble multi-target Pages site
        env:
          CANDIDATE_RUN_ID: ${{ steps.retained.outputs.candidate-run-id }}
          BASE_RUN_ID: ${{ steps.retained.outputs.base-run-id }}
          BASE_KIND: ${{ steps.retained.outputs.base-kind }}
        run: |
          args=(
            --output-dir site
            --expected-outline outline.md
            --candidate "$TARGET_ID=candidate"
            --candidate-run-id "$TARGET_ID=$CANDIDATE_RUN_ID"
          )
          if [ "$BASE_KIND" = "showcase" ]; then
            args+=(--base-showcase base-showcase)
          elif [ "$BASE_KIND" = "legacy-academic" ]; then
            args+=(--candidate "journal_academic=legacy-academic")
            args+=(--candidate-run-id "journal_academic=$BASE_RUN_ID")
          fi
          python tools/build_self_example_showcase.py "${args[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload inspectable publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-example-showcase-${{ github.run_id }}
          path: site
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish selected retained candidate
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy accepted showcase to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
