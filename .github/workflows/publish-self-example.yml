name: Publish self-example

# Publication is intentionally separate from compilation. This workflow is
# keyless: it only reuses explicitly selected retained candidate artifacts.
on:
  workflow_dispatch:
    inputs:
      journal_academic_run_id:
        description: "Compile run ID for journal_academic (blank to omit)"
        required: false
        type: string
      magazine_general_run_id:
        description: "Compile run ID for magazine_general (blank to omit)"
        required: false
        type: string
      explain_like_im_5_run_id:
        description: "Compile run ID for explain_like_im_5 (blank to omit)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: compiled-prose-self-example-publish
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble retained candidates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
    env:
      JOURNAL_RUN_ID: ${{ inputs.journal_academic_run_id }}
      MAGAZINE_RUN_ID: ${{ inputs.magazine_general_run_id }}
      ELI5_RUN_ID: ${{ inputs.explain_like_im_5_run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate explicit candidate selections
        run: |
          selected=0
          for value in "$JOURNAL_RUN_ID" "$MAGAZINE_RUN_ID" "$ELI5_RUN_ID"; do
            if [ -n "$value" ]; then
              selected=$((selected + 1))
              if ! [[ "$value" =~ ^[0-9]+$ ]]; then
                echo "Compile run IDs must be numeric: $value" >&2
                exit 2
              fi
            fi
          done
          if [ "$selected" -eq 0 ]; then
            echo "Select at least one explicit compile run ID to publish." >&2
            exit 2
          fi

      - name: Install keyless publication dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          pandoc --version

      - name: Download journal_academic candidate
        if: ${{ inputs.journal_academic_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: self-example-candidate-*
          path: candidates/journal_academic
          run-id: ${{ inputs.journal_academic_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download magazine_general candidate
        if: ${{ inputs.magazine_general_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: self-example-candidate-*
          path: candidates/magazine_general
          run-id: ${{ inputs.magazine_general_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download explain_like_im_5 candidate
        if: ${{ inputs.explain_like_im_5_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: self-example-candidate-*
          path: candidates/explain_like_im_5
          run-id: ${{ inputs.explain_like_im_5_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Assemble multi-target Pages site
        run: |
          args=(--output-dir site)
          if [ -n "$JOURNAL_RUN_ID" ]; then
            args+=(--candidate "journal_academic=candidates/journal_academic")
          fi
          if [ -n "$MAGAZINE_RUN_ID" ]; then
            args+=(--candidate "magazine_general=candidates/magazine_general")
          fi
          if [ -n "$ELI5_RUN_ID" ]; then
            args+=(--candidate "explain_like_im_5=candidates/explain_like_im_5")
          fi
          python tools/build_self_example_showcase.py "${args[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload inspectable publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-example-showcase-${{ github.run_id }}
          path: site
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish selected retained candidates
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy accepted showcase to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
